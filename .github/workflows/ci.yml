name: API Test Suite

on:
  push:
    branches: ["main"]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Execute Pytest suite
        env:
          API_KEY: ci_test_key_placeholder
        run: pytest -v

      - name: Start FastAPI server in background
        env:
          API_KEY: ci_test_key_placeholder
        run: |
          uvicorn src.main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Install k6
        run: |
          curl -L -o k6.tar.gz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          rm -rf k6.tar.gz k6-v0.54.0-linux-amd64

      - name: Start FastAPI and Execute k6 Tests
        env:
          API_KEY: ci_test_key_placeholder
        run: |
          uvicorn src.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          k6 run performance_tests/load_test.js || true
          k6 run performance_tests/spike_test.js || true
          k6 run performance_tests/stress_test.js || true
